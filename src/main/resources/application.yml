server:
  # The API listens on loopback only. Expose it with a tunnel (e.g. cloudflared),
  # never by binding to 0.0.0.0.
  address: 127.0.0.1
  port: ${BRIDGE_PORT:8765}

spring:
  datasource:
    url: jdbc:sqlite:${BRIDGE_DB:claude-local-bridge.db}
    hikari:
      maximum-pool-size: 1   # SQLite: one writer, avoids SQLITE_BUSY

bridge:
  hmac-secret: ${BRIDGE_HMAC_SECRET:}
  approval-ttl: 30m
  max-task-chars: 3000
  # Longer results are cut in the DB / Telegram / API; the full text is kept in runner.output-dir
  max-result-chars: 3500
  ui:
    # Language of Telegram messages, toasts and the local page: en or ru
    language: ${BRIDGE_LANGUAGE:en}
  telegram:
    enabled: ${BRIDGE_TELEGRAM_ENABLED:true}
    bot-token: ${BRIDGE_TELEGRAM_TOKEN:}
    chat-id: ${BRIDGE_TELEGRAM_CHAT_ID:0}
  access:
    # New folders may only be requested inside these directories (comma-separated, e.g.
    # E:\,D:\code). Empty: requests for new folders are refused.
    roots: ${BRIDGE_ACCESS_ROOTS:}
  desktop:
    enabled: ${BRIDGE_DESKTOP_ENABLED:true}
    port: 8766
    # Toast buttons decide in the background through a claude-bridge: URL handler
    # (registered for the current user at startup); false = buttons open the local page
    protocol-buttons: true
  runner:
    command: claude
    # Limits for one task. The idle limit is what usually stops a stuck agent: it counts
    # time with no new output. Claude Code moves a long Bash command to the background
    # (after 2 min) and reports it in the stream; while such a command runs, the longer
    # background idle limit applies. default-timeout is only the hard ceiling.
    default-timeout: 2h          # total, per task; a folder's own timeout overrides it
    idle-timeout: 5m             # no output and nothing running in the background
    background-idle-timeout: 2h  # no output while background commands are running
    exit-grace: 30s              # answered, nothing in the background, but still running
    output-dir: outputs          # outputs/<folder>/<session id>/<task id>.txt
    output-retention: 30d        # 0 = keep forever; the DB row (short result) is always kept
    # Asks Claude to end with a "SUMMARY: ..." line, shown first in Telegram and in the
    # result toast. Uncomment to change it; an empty value turns it off.
    # summary-prompt: ""
  # Folders the remote side may target, by name. Paths and tools are fixed here,
  # never taken from the request.
  folders:
    pibench:
      path: 'E:\pibench'
      allowed-tools: [Read, Grep, Glob, Edit, Write, "Bash(python:*)", "Bash(git status:*)", "Bash(git diff:*)"]
